<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES Decrypt Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2c3e50;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #718096;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 6px;
        }

        textarea,
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            color: #2d3748;
            background: #f7fafc;
            transition: all 0.2s ease;
        }

        textarea:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #4299e1;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .hint {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4299e1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            background: #3182ce;
        }

        button:active:not(:disabled) {
            background: #2b6cb0;
        }

        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }

        .output {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            display: none;
        }

        .output.show {
            display: block;
        }

        .output.error {
            background: #fff5f5;
            border-color: #fed7d7;
        }

        .output.success {
            background: #f0fff4;
            border-color: #c6f6d5;
        }

        .output-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: #718096;
        }

        .output.error .output-label {
            color: #c53030;
        }

        .output.success .output-label {
            color: #2f855a;
        }

        .output pre {
            background: #1a202c;
            color: #e2e8f0;
            padding: 14px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .output img {
            max-width: 100%;
            border-radius: 6px;
            display: block;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
        }

        .output p {
            font-size: 14px;
            margin-bottom: 10px;
            color: #2d3748;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #48bb78;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .download-btn:hover {
            background: #38a169;
        }

        .key-status {
            font-size: 12px;
            margin-top: 4px;
            color: #a0aec0;
        }

        .key-status.valid {
            color: #38a169;
        }

        .key-status.invalid {
            color: #e53e3e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AES Decrypt Tool</h1>
        <p class="subtitle">Decrypt AES-256 encrypted data</p>

        <div class="form-group">
            <label for="encryptedInput">Encrypted Data (Base64)</label>
            <textarea id="encryptedInput" 
                      placeholder="Paste encrypted base64 string..."></textarea>
        </div>

        <div class="form-group">
            <label for="keyInput">Secret Key</label>
            <input type="text" 
                   id="keyInput" 
                   placeholder="Enter 32-character key"
                   maxlength="32"
                   autocomplete="off">
            <div class="key-status" id="keyStatus">0 / 32 characters</div>
        </div>

        <button onclick="decryptData()" id="decryptBtn">Decrypt</button>

        <div id="output" class="output">
            <div class="output-label" id="outputLabel">Result</div>
            <div id="outputContent"></div>
        </div>
    </div>

    <script>
        // Key validation
        document.getElementById('keyInput').addEventListener('input', function () {
            const len = this.value.length;
            const status = document.getElementById('keyStatus');
            status.textContent = `${len} / 32 characters`;

            if (len === 32) {
                status.className = 'key-status valid';
                status.textContent += ' ✓';
            } else {
                status.className = 'key-status invalid';
            }
        });

        // Main decrypt function
        async function decryptData() {
            const encryptedBase64 = document.getElementById('encryptedInput').value.trim();
            const keyString = document.getElementById('keyInput').value.trim();
            const output = document.getElementById('output');
            const outputLabel = document.getElementById('outputLabel');
            const outputContent = document.getElementById('outputContent');
            const btn = document.getElementById('decryptBtn');

            output.className = 'output show';
            outputContent.innerHTML = '';
            btn.disabled = true;
            btn.textContent = 'Decrypting...';

            try {
                // Validation
                if (!encryptedBase64) throw new Error('Please paste encrypted data.');
                if (keyString.length !== 32) throw new Error('Key must be 32 characters.');

                // Base64 decode
                const encryptedBytes = base64ToBytes(encryptedBase64);
                if (encryptedBytes.length < 16) throw new Error('Data too short.');

                // Extract IV (first 16 bytes)
                const iv = encryptedBytes.slice(0, 16);
                const cipherBytes = encryptedBytes.slice(16);

                // Import key
                const keyBytes = new TextEncoder().encode(keyString);
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    keyBytes,
                    { name: 'AES-CBC' },
                    false,
                    ['decrypt']
                );

                // Decrypt
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-CBC', iv: iv },
                    cryptoKey,
                    cipherBytes
                );

                const decryptedBytes = new Uint8Array(decryptedBuffer);

                // Output
                output.className = 'output show success';
                outputLabel.textContent = 'Decrypted Successfully';

                // Detect type
                const type = detectType(decryptedBytes);

                if (type === 'image') {
                    showImage(decryptedBytes, outputContent);
                } else {
                    showText(decryptedBytes, outputContent);
                }

            } catch (error) {
                output.className = 'output show error';
                outputLabel.textContent = 'Decryption Failed';
                outputContent.innerHTML = `<p>${escapeHtml(error.message)}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Decrypt';
            }
        }

        // Type detection
        function detectType(bytes) {
            if (bytes.length < 4) return 'text';

            // PNG
            if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47)
                return 'image';
            // JPEG
            if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF)
                return 'image';
            // GIF
            if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46)
                return 'image';
            // BMP
            if (bytes[0] === 0x42 && bytes[1] === 0x4D)
                return 'image';

            return 'text';
        }

        // Show text output
        function showText(bytes, el) {
            let text;
            try {
                text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            } catch {
                text = '[Binary data]\n\n' + bytesToBase64(bytes);
            }

            el.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
        }

        // Show image output
        function showImage(bytes, el) {
            let mime = 'image/png';
            if (bytes[0] === 0xFF && bytes[1] === 0xD8) mime = 'image/jpeg';
            else if (bytes[0] === 0x47 && bytes[1] === 0x49) mime = 'image/gif';
            else if (bytes[0] === 0x42 && bytes[1] === 0x4D) mime = 'image/bmp';

            const base64 = bytesToBase64(bytes);
            const dataUrl = `data:${mime};base64,${base64}`;
            const ext = mime.split('/')[1];

            el.innerHTML = `
                <img src="${dataUrl}" alt="Decrypted Image">
                <a href="${dataUrl}" download="decrypted_image.${ext}" class="download-btn">
                    Download Image
                </a>
            `;
        }

        // Helpers
        function base64ToBytes(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        function bytesToBase64(bytes) {
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
